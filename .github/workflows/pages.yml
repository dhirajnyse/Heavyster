name: Deploy Heavyster Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "heavyster-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify static bundle
        run: npm run check

      - name: Prepare Pages artifact
        shell: bash
        run: |
          mkdir -p _site
          cp -R index.html styles.css app.js assets docs scripts .nojekyll LICENSE package.json README.md robots.txt site.webmanifest _site/
          find _site -name "*.zip" -delete
          find _site -name "*.log" -delete

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
